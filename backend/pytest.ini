[pytest]
# Pytest configuration for CodeTraceX

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test output
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (database, API)
    slow: Slow tests (network, large data)
    database: Tests that require database connection

# Test paths
testpaths = tests

# Coverage (if using pytest-cov)
# addopts = --cov=app --cov-report=html --cov-report=term

# Asyncio mode
asyncio_mode = auto
